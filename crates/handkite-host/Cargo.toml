[package]
name = "handkite-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
handkite-core = { path = "../handkite-core" }
libc = "0.2"
quick-xml = "=0.38.4"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt", "time"] }
zeroize = "1.8"
