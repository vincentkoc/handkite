[package]
name = "handkite-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
handkite-core = { path = "../handkite-core" }
libc = "0.2"
plist = "=1.8.0"
quick-xml = "=0.38.4"
idevice = { version = "=0.1.68", default-features = false, features = ["misagent", "ring", "usbmuxd", "xctest"] }
ring = "=0.17.14"
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
zeroize = "1.8"

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
