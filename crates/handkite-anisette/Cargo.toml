# Optional Apple-account/Anisette tooling. This is its own workspace and is
# excluded from the root workspace: it is not built by default and nothing in
# the root workspace depends on it.
[package]
name = "handkite-anisette"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace]

[dependencies]
base64 = "=0.22.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2"
plist = "=1.8.0"
quick-xml = "=0.38.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
time = { version = "=0.3.47", features = ["formatting"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.27.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "=1.0.11"
zeroize = "1.8"

[dev-dependencies]
rcgen = "=0.12.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
