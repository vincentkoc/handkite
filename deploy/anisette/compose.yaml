services:
  anisette:
    image: ghcr.io/fdkevin0/anisette-server-rs@sha256:2daafc9a0251416f25452ec561b3c2c1e9f2c9060e3e05b386fd6fe1cc1fd0ad
    command: ["--backend", "macos"]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${HANDKITE_ANISETTE_PORT:-6969}:6969"
    volumes:
      - type: bind
        source: ${HANDKITE_ANISETTE_DATA:?set an absolute private data directory}
        target: /data
    logging:
      driver: "none"
